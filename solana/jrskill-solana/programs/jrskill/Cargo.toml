[package]
name = "jrskill"
version = "0.1.0"
description = "JrSkill Network Stage 2: immutable payload proof"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "jrskill"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
sha2 = "=0.10.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
