<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" rx="28" fill="#030915"/><rect width="1200" height="10" fill="#28d8f4"/><text x="600" y="72" text-anchor="middle" fill="#2dd4f0" font-family="Arial" font-size="20" font-weight="700">01 · EXPERIÊNCIA</text><text x="600" y="132" text-anchor="middle" fill="#fff" font-family="Arial" font-size="48" font-weight="800">Um JrBot. Diferentes companheiros.</text><text x="600" y="171" text-anchor="middle" fill="#aab7c5" font-family="Arial" font-size="21">O mesmo hardware pode assumir diferentes papéis por meio das Skills.</text><g font-family="Arial"><g transform="translate(70 220)"><rect width="500" height="220" rx="18" fill="#0b1a2d" stroke="#1f78b4" stroke-width="2"/><text x="42" y="55" fill="#f1b65b" font-size="17" font-weight="700">CRIANÇA</text><text x="42" y="95" fill="#fff" font-size="29" font-weight="800">Amigo de brincadeiras</text><text x="42" y="135" fill="#b9c4cf" font-size="19">Histórias, jogos, aprendizado</text><text x="42" y="165" fill="#b9c4cf" font-size="19">e imaginação.</text></g><g transform="translate(630 220)"><rect width="500" height="220" rx="18" fill="#0b1a2d" stroke="#1f78b4" stroke-width="2"/><text x="42" y="55" fill="#38d8f2" font-size="17" font-weight="700">ESTUDO</text><text x="42" y="95" fill="#fff" font-size="29" font-weight="800">Professor e parceiro</text><text x="42" y="135" fill="#b9c4cf" font-size="19">Idiomas, cursos, treinamento</text><text x="42" y="165" fill="#b9c4cf" font-size="19">e prática diária.</text></g><g transform="translate(70 470)"><rect width="500" height="220" rx="18" fill="#0b1a2d" stroke="#227f7c" stroke-width="2"/><text x="42" y="55" fill="#5be0c0" font-size="17" font-weight="700">COMPANHIA</text><text x="42" y="95" fill="#fff" font-size="29" font-weight="800">Presença na rotina</text><text x="42" y="135" fill="#b9c4cf" font-size="19">Conversa, lembretes e futuros</text><text x="42" y="165" fill="#b9c4cf" font-size="19">recursos de contato e apoio.</text></g><g transform="translate(630 470)"><rect width="500" height="220" rx="18" fill="#0b1a2d" stroke="#8b2b8f" stroke-width="2"/><text x="42" y="55" fill="#ff49c8" font-size="17" font-weight="700">PERSONALIDADE</text><text x="42" y="95" fill="#fff" font-size="29" font-weight="800">Torcedor com você</text><text x="42" y="135" fill="#b9c4cf" font-size="19">Acessórios e Skills podem mudar</text><text x="42" y="165" fill="#b9c4cf" font-size="19">comportamento e personalidade.</text></g></g><rect x="190" y="730" width="820" height="58" rx="15" fill="#071727" stroke="#2bd8f2" stroke-width="2"/><text x="600" y="766" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">O hardware é o mesmo. A experiência muda por meio das Skills.</text></svg>