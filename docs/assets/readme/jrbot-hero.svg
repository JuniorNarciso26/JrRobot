<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#030915"/><text x="80" y="90" fill="#2dd4f0" font-family="Arial" font-size="22" font-weight="700">UMA NOVA CATEGORIA DE COMPANHIA DIGITAL</text><text x="80" y="175" fill="#fff" font-family="Arial" font-size="70" font-weight="800">JrBot</text><text x="80" y="250" fill="#fff" font-family="Arial" font-size="38" font-weight="700">A IA que deixa de ser apenas uma ferramenta</text><text x="80" y="298" fill="#fff" font-family="Arial" font-size="38" font-weight="700">e passa a ser presença.</text><text x="80" y="355" fill="#38d7f4" font-family="Arial" font-size="22" font-weight="700">Ouve · Entende · Responde · Reage · Expressa</text><rect x="76" y="408" width="650" height="112" rx="18" fill="#071727" stroke="#2dd4f0" stroke-width="2"/><text x="108" y="455" fill="#fff" font-family="Arial" font-size="24" font-weight="700" font-style="italic">“O JrBot não foi criado apenas para responder.</text><text x="108" y="490" fill="#fff" font-family="Arial" font-size="24" font-weight="700" font-style="italic">Foi criado para estar com você.”</text><g transform="translate(860 130)"><rect x="30" y="0" width="220" height="150" rx="48" fill="#e7edf1"/><rect x="60" y="32" width="160" height="92" rx="30" fill="#071726"/><circle cx="110" cy="78" r="12" fill="#33d9f5"/><circle cx="172" cy="78" r="12" fill="#33d9f5"/><path d="M108 110 Q141 132 174 110" fill="none" stroke="#33d9f5" stroke-width="7" stroke-linecap="round"/><rect x="0" y="158" width="280" height="260" rx="88" fill="#dfe7ed"/><rect x="75" y="230" width="130" height="88" rx="34" fill="#142536"/></g><text x="80" y="590" fill="#9eb0c0" font-family="Arial" font-size="18">Uma plataforma de personalidade, interação e Skills.</text></svg>